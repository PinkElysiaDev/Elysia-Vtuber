<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox Overlay</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <style>
    body {
      background: transparent !important;
      background-image: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .jukebox-card {
      width: 440px;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .disc-container {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .vinyl-disc {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, #18181b 35%, #27272a 36%, #09090b 70%);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-cyan-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.5s ease;
    }

    .vinyl-disc img {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
    }

    .song-info {
      flex: 1;
      overflow: hidden;
    }

    .song-title {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .song-artist {
      font-size: 14px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lyric-line {
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      min-height: 24px;
      color: var(--accent-cyan);
      text-shadow: 0 0 12px var(--accent-cyan-glow);
      margin-top: 10px;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="jukebox-card glass-panel">
    <div class="disc-container">
      <div class="vinyl-disc animate-spin" id="disc">
        <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150&q=80" id="cover" alt="Cover">
      </div>
      <div class="song-info">
        <div class="song-title" id="title">未播放</div>
        <div class="song-artist" id="artist">等待点歌</div>
        <div class="badge" id="badge" style="margin-top: 8px;">空闲</div>
      </div>
    </div>

    <!-- Audio Spectrum Bars Canvas -->
    <div style="height: 60px; width: 100%;">
      <canvas id="spectrumCanvas" style="width: 100%; height: 100%;"></canvas>
    </div>

    <!-- Dynamic Neon Lyric Line -->
    <div class="lyric-line" id="lyric"></div>
  </div>

  <script src="assets/js/rpc-client.js"></script>
  <script src="assets/js/audio-visualizer.js"></script>
  <script>
    const spectrum = new AudioSpectrumVisualizer(document.getElementById('spectrumCanvas'), { barCount: 36 });
    spectrum.startSimulated();

    function applyNowPlaying(np, running) {
      const title = document.getElementById('title');
      const artist = document.getElementById('artist');
      const badge = document.getElementById('badge');
      const lyric = document.getElementById('lyric');
      const cover = document.getElementById('cover');
      if (!np) {
        title.textContent = '未播放';
        artist.textContent = running ? '等待点歌' : '点歌机未启动';
        badge.textContent = running ? '空闲' : '停止';
        badge.className = 'badge';
        lyric.textContent = '';
        return;
      }
      title.textContent = np.title || '未知歌曲';
      artist.textContent = np.artist || np.userName || '';
      badge.textContent = np.paused ? '暂停' : '播放中';
      badge.className = 'badge badge-success';
      if (np.cover) cover.src = np.cover;
      if (np.lyric) lyric.textContent = np.lyric;
    }

    window.vtuberRPC.on('jukebox.state', (state) => {
      if (!state) return;
      applyNowPlaying(state.nowPlaying, state.running);
    });
    window.vtuberRPC.on('jukebox.nowPlaying', (np) => applyNowPlaying(np, true));

    window.addEventListener('load', async () => {
      try {
        await window.vtuberRPC.whenReady();
        const state = await window.vtuberRPC.call('jukebox.getState');
        applyNowPlaying(state.nowPlaying, state.running);
      } catch (e) {
        document.getElementById('artist').textContent = '未连接逻辑服务';
      }
    });
  </script>
</body>
</html>
