<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live2D Stage Overlay</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <style>
    body {
      background: transparent !important;
      background-image: none !important;
    }

    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .particles-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .emotion-toast {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-lg);
    }

    .emotion-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-10px);
    }
  </style>
</head>
<body>
  <canvas class="particles-bg" id="particleCanvas"></canvas>
  <canvas id="canvas"></canvas>
  <div class="emotion-toast glass-panel" id="toast">Live2D Stage Ready</div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.5.0/dist/index.min.js"></script>
  <script src="assets/js/rpc-client.js"></script>
  <script src="assets/js/particles.js"></script>

  <script>
    const { Application } = PIXI;
    const { Live2DModel } = PIXI.live2d;

    let app, model;
    const particleSys = new ParticleSystem(document.getElementById('particleCanvas'));
    particleSys.start();

    async function initApp() {
      app = new Application({
        view: document.getElementById('canvas'),
        width: window.innerWidth,
        height: window.innerHeight,
        transparent: true,
        backgroundAlpha: 0,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
      });

      window.addEventListener('resize', () => {
        app.renderer.resize(window.innerWidth, window.innerHeight);
        if (model) updateModelTransform();
      });
    }

    async function loadModel(modelPath) {
      try {
        if (model) {
          app.stage.removeChild(model);
          model.destroy();
        }
        model = await Live2DModel.from(modelPath);
        updateModelTransform();

        model.interactive = true;
        model.buttonMode = true;
        model.on('pointerdown', () => {
          particleSys.burst(model.x, model.y, 25);
        });

        app.stage.addChild(model);
        showToast('Model loaded successfully');
      } catch (err) {
        showToast('Load failed: ' + err.message);
      }
    }

    function updateModelTransform() {
      if (!model) return;
      const scale = Math.min(window.innerWidth / model.width, window.innerHeight / model.height) * 0.85;
      model.scale.set(scale);
      model.x = window.innerWidth / 2;
      model.y = window.innerHeight / 2;
      model.anchor.set(0.5, 0.5);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    window.vtuberRPC.on('live2d:expression', (data) => {
      if (model && model.internalModel.motionManager.expressionManager) {
        model.internalModel.motionManager.expressionManager.setExpression(data.expression);
        showToast(`Expression: ${data.expression}`);
        particleSys.burst(window.innerWidth / 2, window.innerHeight / 2, 15);
      }
    });

    window.vtuberRPC.on('live2d:load', (data) => loadModel(data.modelPath));

    initApp();
  </script>
</body>
</html>
