<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Board Overlay</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <style>
    body {
      background: transparent !important;
      background-image: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .display-card {
      width: 100%;
      max-width: 780px;
      padding: 28px 36px;
      border-radius: var(--radius-lg);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .text-content {
      font-size: 22px;
      line-height: 1.65;
      font-weight: 500;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .emotion-happy { color: var(--accent-emerald); text-shadow: 0 0 16px var(--accent-emerald-glow); }
    .emotion-sad { color: var(--accent-cyan); text-shadow: 0 0 16px var(--accent-cyan-glow); }
    .emotion-excited { color: var(--accent-amber); text-shadow: 0 0 16px var(--accent-amber-glow); }
    .emotion-angry { color: var(--accent-rose); text-shadow: 0 0 16px var(--accent-rose-glow); }
    .emotion-neutral { color: var(--text-primary); }

    .timestamp {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="display-card glass-panel animate-float" id="displayCard">
    <div class="text-content emotion-neutral" id="textContent">等待中控台输入字幕或对话响应...</div>
    <div class="timestamp" id="timeStr">12:00:00</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@11.0.0/marked.min.js"></script>
  <script src="assets/js/rpc-client.js"></script>
  <script>
    let typewriterTimer = null;

    function typewriterEffect(element, fullText, speed = 35) {
      if (typewriterTimer) clearInterval(typewriterTimer);
      element.textContent = '';
      let index = 0;
      typewriterTimer = setInterval(() => {
        if (index < fullText.length) {
          element.textContent += fullText.charAt(index);
          index++;
        } else {
          clearInterval(typewriterTimer);
        }
      }, speed);
    }

    function updateDisplay(data) {
      const textElem = document.getElementById('textContent');
      const timeElem = document.getElementById('timeStr');
      const { text, emotion, style } = data;

      textElem.className = 'text-content emotion-' + (emotion || 'neutral');

      if (style === 'markdown' && window.marked) {
        textElem.innerHTML = marked.parse(text);
      } else {
        typewriterEffect(textElem, text || '');
      }

      timeElem.textContent = new Date().toLocaleTimeString('zh-CN');
    }

    window.vtuberRPC.on('output.display', (data) => updateDisplay(data || {}));
    window.vtuberRPC.on('display.update', (data) => updateDisplay(data || {}));
    window.vtuberRPC.on('display.clear', () => {
      document.getElementById('textContent').textContent = '';
      document.getElementById('timeStr').textContent = '';
    });
  </script>
</body>
</html>
