<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Mini Player Overlay</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <style>
    body {
      background: transparent !important;
      background-image: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .mini-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      border-radius: var(--radius-full);
      max-width: 380px;
    }

    .mini-disc {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 10px var(--accent-cyan-glow);
    }
  </style>
</head>
<body>
  <div class="mini-card glass-panel animate-float">
    <img class="mini-disc animate-spin" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150&q=80" id="cover" alt="Cover">
    <div style="overflow: hidden;">
      <div style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="title">晴天</div>
      <div style="font-size: 12px; color: var(--text-secondary);" id="artist">周杰伦</div>
    </div>
  </div>

  <script src="assets/js/rpc-client.js"></script>
  <script>
    window.vtuberRPC.on('music:play', (data) => {
      if (!data) return;
      document.getElementById('title').textContent = data.title || '未知歌曲';
      document.getElementById('artist').textContent = data.artist || '未知歌手';
      if (data.cover) document.getElementById('cover').src = data.cover;
    });
  </script>
</body>
</html>
