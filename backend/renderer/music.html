<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #0A0D12 0%, #1E2636 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      padding: clamp(1rem, 3vw, 2rem);
    }

    .player-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: clamp(1rem, 2vw, 1.5rem);
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .cover-section {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .cover {
      width: clamp(180px, 40vw, 280px);
      height: clamp(180px, 40vw, 280px);
      border-radius: 50%;
      background: linear-gradient(135deg, #1E2636 0%, #0F131C 100%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .cover.playing {
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .cover-placeholder {
      font-size: clamp(3rem, 8vw, 5rem);
      color: rgba(255, 255, 255, 0.1);
    }

    .info-section {
      text-align: center;
      padding: 0 1rem;
    }

    .song-title {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 600;
      color: #F3F4F6;
      margin-bottom: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: rgba(229, 231, 235, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-section {
      padding: 0 1rem;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.5rem;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #38BDF8 0%, #6EE7B7 100%);
      border-radius: 999px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-time {
      display: flex;
      justify-content: space-between;
      font-size: clamp(0.75rem, 1.5vw, 0.875rem);
      color: rgba(229, 231, 235, 0.5);
    }

    .controls-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(1rem, 3vw, 2rem);
      padding: 1rem;
    }

    .control-btn {
      width: clamp(48px, 10vw, 64px);
      height: clamp(48px, 10vw, 64px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #E5E7EB;
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.05);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn.play-pause {
      width: clamp(64px, 12vw, 80px);
      height: clamp(64px, 12vw, 80px);
      background: linear-gradient(135deg, #38BDF8 0%, #6EE7B7 100%);
      border: none;
      font-size: clamp(1.5rem, 3vw, 2rem);
    }

    .volume-section {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1rem;
    }

    .volume-icon {
      color: rgba(229, 231, 235, 0.6);
      font-size: clamp(1rem, 2vw, 1.25rem);
    }

    .volume-slider {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .volume-fill {
      height: 100%;
      background: linear-gradient(90deg, #38BDF8 0%, #6EE7B7 100%);
      border-radius: 999px;
      width: 80%;
      transition: width 0.3s ease;
    }

    .status-message {
      text-align: center;
      color: rgba(229, 231, 235, 0.4);
      font-size: clamp(0.875rem, 1.5vw, 1rem);
      padding: 1rem;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <div class="cover-section">
      <div class="cover" id="cover">
        <span class="cover-placeholder">🎵</span>
      </div>
    </div>

    <div class="info-section">
      <div class="song-title" id="songTitle">暂无播放</div>
      <div class="song-artist" id="songArtist">-</div>
    </div>

    <div class="progress-section">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls-section">
      <div class="control-btn" id="prevBtn">⏮</div>
      <div class="control-btn play-pause" id="playPauseBtn">▶</div>
      <div class="control-btn" id="nextBtn">⏭</div>
    </div>

    <div class="volume-section">
      <div class="volume-icon">🔊</div>
      <div class="volume-slider" id="volumeSlider">
        <div class="volume-fill" id="volumeFill"></div>
      </div>
    </div>

    <div class="status-message" id="statusMessage"></div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const cover = document.getElementById('cover');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTime = document.getElementById('currentTime');
    const duration = document.getElementById('duration');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeFill = document.getElementById('volumeFill');
    const statusMessage = document.getElementById('statusMessage');
    const audioPlayer = document.getElementById('audioPlayer');

    let isPlaying = false;
    let currentVolume = 0.8;

    // 播放歌曲
    function playSong(song) {
      if (!song) return;

      songTitle.textContent = song.title || '未知歌曲';
      songArtist.textContent = song.artist || '未知艺术家';

      // 更新封面
      if (song.cover) {
        cover.innerHTML = `<img src="${song.cover}" alt="封面">`;
      } else {
        cover.innerHTML = '<span class="cover-placeholder">🎵</span>';
      }

      // 加载音频
      if (song.url) {
        audioPlayer.src = song.url;
        audioPlayer.play();
        isPlaying = true;
        playPauseBtn.textContent = '⏸';
        cover.classList.add('playing');
      }

      statusMessage.textContent = '';
    }

    // 切换播放/暂停
    function togglePlayPause() {
      if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
        playPauseBtn.textContent = '▶';
        cover.classList.remove('playing');
      } else {
        audioPlayer.play();
        isPlaying = true;
        playPauseBtn.textContent = '⏸';
        cover.classList.add('playing');
      }
    }

    // 格式化时间
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // 更新进度条
    function updateProgress() {
      if (audioPlayer.duration) {
        const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTime.textContent = formatTime(audioPlayer.currentTime);
        duration.textContent = formatTime(audioPlayer.duration);
      }
    }

    // 更新音量
    function setVolume(volume) {
      currentVolume = Math.max(0, Math.min(1, volume));
      audioPlayer.volume = currentVolume;
      volumeFill.style.width = `${currentVolume * 100}%`;
    }

    // 事件监听
    audioPlayer.addEventListener('timeupdate', updateProgress);
    audioPlayer.addEventListener('ended', () => {
      isPlaying = false;
      playPauseBtn.textContent = '▶';
      cover.classList.remove('playing');
      statusMessage.textContent = '播放完毕';
    });

    playPauseBtn.addEventListener('click', togglePlayPause);

    progressBar.addEventListener('click', (e) => {
      if (audioPlayer.duration) {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        audioPlayer.currentTime = audioPlayer.duration * percent;
      }
    });

    volumeSlider.addEventListener('click', (e) => {
      const rect = volumeSlider.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      setVolume(percent);
    });

    // 初始化音量
    setVolume(currentVolume);

    // IPC 通信（Electron）
    if (window.electronAPI) {
      window.electronAPI.on('music:play', (data) => {
        playSong(data.song);
      });

      window.electronAPI.on('music:pause', () => {
        if (isPlaying) {
          togglePlayPause();
        }
      });

      window.electronAPI.on('music:volume', (data) => {
        setVolume(data.volume);
      });
    }
  </script>
</body>
</html>
