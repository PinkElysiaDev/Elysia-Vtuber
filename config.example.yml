# Koishi 插件配置。事件接收开关 / LLM / TTS / 点歌在逻辑服务 WebUI 里改，不要写在这里。

plugins:
  vtuber:
    roomId: "0"
    backend:
      host: localhost
      wsPort: 19275
      autoStart: true
      nodePath: node
      entryPath: backend/dist/index.js
      workingDir: backend
      startTimeout: 15000
      reconnectInterval: 5000
      timeout: 10000
    danmaku:
      platform: bililive
